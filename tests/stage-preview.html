<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>선거 장면 검증</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #101c2c; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100dvh; }
      canvas { display: block; }
      nav { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px; }
      button { padding: 6px 12px; border: 1px solid #7c9298; background: #e9e5d4; color: #15213b; cursor: pointer; }
      button[aria-pressed="true"] { background: #fbd975; }
      #stage { position: relative; width: 100vw; flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <nav aria-label="검증할 장면"><button data-kind="voting">투표소</button><button data-kind="brawl">몸싸움</button><button data-kind="scandal">부정부패 탈락</button><button data-kind="comeback">지원군</button><button data-kind="mishap">실수</button><button data-kind="alliance">연합</button><button data-kind="blackout">정전</button><button data-kind="winner">당선 후속 장면</button><button data-freeze="700">사건 포착 정지</button><button data-freeze="3000">현장 연결 정지</button><button data-freeze="5600">판정 공개 정지</button><button data-freeze="7500">판세 반영 정지</button><span id="status" role="status">재생 중</span></nav>
    <div id="stage" role="img" aria-label="선거 장면 검증 무대"></div>
    <script type="module" src="/tests/stage-preview.ts"></script>
  </body>
</html>
