<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>선거 장면 검증</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #101c2c; color: white; font-family: sans-serif; }
      canvas { display: block; }
      nav { height: 46px; display: flex; align-items: center; gap: 8px; padding: 8px; }
      button { padding: 6px 12px; border: 1px solid #7c9298; background: #e9e5d4; color: #15213b; cursor: pointer; }
      button[aria-pressed="true"] { background: #fbd975; }
      #stage { position: relative; width: 100vw; height: calc(100dvh - 46px); }
    </style>
  </head>
  <body>
    <nav aria-label="검증할 사건"><button data-kind="brawl">몸싸움</button><button data-kind="scandal">부정부패 탈락</button><button data-kind="comeback">지원군</button><button data-kind="mishap">실수</button><button data-kind="alliance">연합</button><button data-kind="blackout">정전</button><button data-kind="winner">당선 후속 장면</button><button id="freeze">중간 장면 정지</button><span id="status" role="status">재생 중</span></nav>
    <div id="stage" role="img" aria-label="사건 장면 검증 무대"></div>
    <script type="module" src="/tests/stage-preview.ts"></script>
  </body>
</html>
